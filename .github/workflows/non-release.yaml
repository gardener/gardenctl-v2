name: Build
on:
  push:
  pull_request:

jobs:
  build:
    uses: $/.github/workflows/build.yaml
    with:
      mode: snapshot
    permissions:
      contents: read
      id-token: write

  component-descriptor:
    uses: gardener/cc-utils/.github/workflows/post-build.yaml@bce63f62928717a11f610ec8022af9feb497d5df # v1 # zizmor: ignore[unpinned-uses,ref-confusion] -- same-org reusable workflow; intentionally allowed for now, planned to pin to a version in the future
    needs:
      - build
    permissions:
      id-token: write
      contents: write
