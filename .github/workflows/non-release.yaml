name: Build
on:
  push:
  pull_request:

jobs:
  build:
    uses: $/.github/workflows/build.yaml
    with:
      mode: snapshot
    permissions:
      contents: read
      id-token: write

  component-descriptor:
    uses: gardener/cc-utils/.github/workflows/post-build.yaml@00522ef3e8504bc7be46394a239a390f112336f6 # 1.2883.0 # zizmor: ignore[unpinned-uses,ref-confusion] -- same-org reusable workflow; intentionally allowed for now, planned to pin to a version in the future
    needs:
      - build
    permissions:
      id-token: write
      contents: write
